[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_nft_marketplace_program = "FnZUe7Vwefyr7wiyP4qR6rHYiANAcsHYLH4aVYXwVdzh"

[programs.devnet]
solana_nft_marketplace_program = "FnZUe7Vwefyr7wiyP4qR6rHYiANAcsHYLH4aVYXwVdzh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
